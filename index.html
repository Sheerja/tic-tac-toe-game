<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TIC TAC TOE</title>
</head>
<body>
    <h1>TIC TAC TOE</h1>
    <div class="container">
        <div class="info">
        <div class="score player1">
            <h2>Player 1</h2>
            <span id="p1score">0</span>
        </div>
        <div class="turn">
                <h2 id="swipeturn">Player <span id="turnof">1</span>'s turn.</h2>
            </div>
            <div class="score player2">
            <h2>Player 2</h2>
             <span id="p2score">0</span>
        </div>
        </div>
        <div class="main">    
            <div class="board">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
            <div class="status">
                <h3>No winner yet</h3>
            </div>
        </div>
        </div>
        <div class="buttons">
            <button id="reset">Reset Game</button>
            <button id="newgame">New Game</button>
        </div>
    <script src="script.js"></script>
</body>
</html>
